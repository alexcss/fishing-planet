name: Build and Deploy Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Build production assets
        run: yarn build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || '2222' }}
          SOURCE: '.'
          TARGET: ${{ secrets.REMOTE_TARGET || '/html/wp-content/themes/flex-press' }}
          ARGS: '-avz --delete'
          EXCLUDE: '.git/,.github/,.windsurf/,.idea/,.vscode/,node_modules/,.env,.env.example,.env.local,.env.development,.env.test,.env.production,.nvmrc,.editorconfig,.eslintignore,.prettierignore,.prettierrc.js,eslint.config.js,tsconfig.json,phpcs.xml.dist,composer.json,composer.lock,package.json,yarn.lock,vite.config.js,vite-plugin-flynt.js,.gitignore,README.md,DESIGN_SYSTEM.md,.DS_Store,packaged/,wpcs/,coverage/,build/,.vercel/,next-env.d.ts,schema.json'
